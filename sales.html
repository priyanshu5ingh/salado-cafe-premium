<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-100">
  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="flex items-center justify-between mb-8">
      <h1 class="text-3xl font-semibold text-white">Sales Command Center</h1>
      <a href="admin.html" class="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold transition-colors">Back to Admin</a>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg">
        <p class="text-xs uppercase tracking-widest text-slate-400 mb-1">Total Sales</p>
        <p id="totalSales" class="text-3xl font-bold text-emerald-300">--</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg">
        <p class="text-xs uppercase tracking-widest text-slate-400 mb-1">Daily Goal</p>
        <p id="dailyGoal" class="text-3xl font-bold text-blue-300">--</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg">
        <p class="text-xs uppercase tracking-widest text-slate-400 mb-1">Monthly Progress</p>
        <p id="monthlyProgress" class="text-3xl font-bold text-amber-300">--</p>
      </div>
      <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg">
        <p class="text-xs uppercase tracking-widest text-slate-400 mb-1">Grand Total Revenue</p>
        <p id="grandTotalRevenue" class="text-3xl font-bold text-violet-300">--</p>
        <div class="mt-3 flex items-center gap-4">
          <div style="position: relative; width: 64px; height: 64px;">
            <canvas id="revenueBreakdownChart"></canvas>
          </div>
          <div class="flex flex-col gap-0.5 text-sm font-semibold">
            <span id="revenueSalesLine" class="text-blue-400">Sales: --</span>
            <span id="revenueSubsLine" class="text-green-400">Subs: --</span>
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-4 mb-6">
      <label class="text-sm text-slate-400 uppercase tracking-wider">Month</label>
      <select id="monthSelect" class="bg-slate-800 border border-slate-600 rounded-xl px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-400"></select>
      <span id="fetchStatus" class="text-sm text-slate-400"></span>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg mb-8">
      <canvas id="salesChart" height="100"></canvas>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 shadow-lg">
      <h2 class="text-lg font-semibold text-white mb-4">Log Today's Sales</h2>
      <form id="logSaleForm" class="flex flex-wrap items-end gap-4">
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Date</label>
          <input type="date" id="logDate" readonly class="bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-500 focus:outline-none cursor-not-allowed">
        </div>
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Daily Sales (₹)</label>
          <input type="number" id="logSales" step="0.01" min="0" placeholder="0" class="bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Daily Goal (₹)</label>
          <input type="number" id="logGoal" step="0.01" min="0" placeholder="0" class="bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400">
        </div>
        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 transition-colors whitespace-nowrap">Log Sale</button>
        <span id="logStatus" class="text-sm text-slate-400"></span>
      </form>
    </div>
  </main>

  <script>
    (() => {
      const monthSelect = document.getElementById('monthSelect');
      const logForm = document.getElementById('logSaleForm');
      const logDate = document.getElementById('logDate');
      const logSales = document.getElementById('logSales');
      const logGoal = document.getElementById('logGoal');
      const logStatus = document.getElementById('logStatus');
      const fetchStatus = document.getElementById('fetchStatus');
      let chartInstance = null;
      let doughnutInstance = null;

      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const now = new Date();
      for (let i = 0; i < 12; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = monthNames[i];
        if (i === now.getMonth()) opt.selected = true;
        monthSelect.appendChild(opt);
      }

      const istOffset = 5.5 * 60 * 60 * 1000;
      const istDate = new Date(now.getTime() + istOffset);
      logDate.value = istDate.toISOString().split('T')[0];
      logDate.readOnly = true;

      function formatINR(value) {
        return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 2 }).format(value);
      }

      async function fetchSalesData(month, year) {
        fetchStatus.textContent = 'Loading...';
        try {
          const res = await fetch(`https://salado-cafe-premium.onrender.com/api/sales-data?month=${month + 1}&year=${year}`);
          const json = await res.json();
          if (!json.success) throw new Error(json.message || 'Failed to load');

          const { dailyRecords, totalSales, totalSubscriptionRevenue, grandTotalRevenue, dailyGoal, monthlyProgress } = json.data;

          document.getElementById('totalSales').textContent = formatINR(totalSales);
          document.getElementById('dailyGoal').textContent = formatINR(dailyGoal);
          document.getElementById('monthlyProgress').textContent = Number(monthlyProgress) + '%';

          document.getElementById('grandTotalRevenue').textContent = formatINR(grandTotalRevenue);
          document.getElementById('revenueSalesLine').textContent = 'Sales: ' + formatINR(totalSales);
          document.getElementById('revenueSubsLine').textContent = 'Subs: ' + formatINR(totalSubscriptionRevenue);

          updateDoughnut(totalSales, totalSubscriptionRevenue);
          fetchStatus.textContent = `${dailyRecords.length} day(s) loaded`;
          updateChart(dailyRecords);
        } catch (err) {
          fetchStatus.textContent = 'Error loading data';
          console.error(err);
        }
      }

      function updateDoughnut(salesVal, subVal) {
        const canvas = document.getElementById('revenueBreakdownChart');
        if (doughnutInstance) doughnutInstance.destroy();

        doughnutInstance = new Chart(canvas, {
          type: 'doughnut',
          data: {
            labels: ['Sales', 'Subscriptions'],
            datasets: [{
              data: [salesVal, subVal],
              backgroundColor: ['#3b82f6', '#10b981'],
              borderColor: 'transparent'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function (ctx) {
                    return ctx.label + ': ' + formatINR(ctx.raw);
                  }
                }
              }
            }
          }
        });
      }

      function updateChart(dailyRecords) {
        const labels = dailyRecords.map(r => r.Date);
        const sales = dailyRecords.map(r => r.DailySales);
        const goals = dailyRecords.map(r => r.DailyGoal);
        const movingAvgs = dailyRecords.map(r => r.movingAverage);

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(document.getElementById('salesChart'), {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Daily Sales',
                data: sales,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointRadius: 4,
                pointBackgroundColor: '#3b82f6'
              },
              {
                label: 'Daily Goal',
                data: goals,
                borderColor: '#ef4444',
                borderWidth: 2,
                borderDash: [6, 4],
                fill: false,
                tension: 0.3,
                pointRadius: 3,
                pointBackgroundColor: '#ef4444'
              },
              {
                label: '7-Day Trend',
                data: movingAvgs,
                borderColor: '#f59e0b',
                backgroundColor: 'rgba(245, 158, 11, 0.05)',
                borderWidth: 2,
                fill: false,
                tension: 0.3,
                pointRadius: 0,
                pointHitRadius: 5
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                labels: { color: '#cbd5e1' }
              },
              tooltip: {
                enabled: true,
                callbacks: {
                  label: function (ctx) {
                    const val = ctx.raw;
                    return ctx.dataset.label + ': ' + formatINR(val);
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: { color: '#94a3b8' },
                grid: { color: 'rgba(148, 163, 184, 0.1)' }
              },
              y: {
                beginAtZero: true,
                ticks: {
                  color: '#94a3b8',
                  callback: function (val) {
                    return '₹ ' + Number(val).toLocaleString('en-IN');
                  }
                },
                grid: { color: 'rgba(148, 163, 184, 0.1)' }
              }
            }
          }
        });
      }

      monthSelect.addEventListener('change', () => {
        const month = parseInt(monthSelect.value, 10);
        const year = new Date().getFullYear();
        fetchSalesData(month, year);
      });

      logForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        logStatus.textContent = 'Logging...';

        const dateVal = logDate.value;
        const salesVal = parseFloat(logSales.value) || 0;
        const goalVal = parseFloat(logGoal.value) || 0;

        if (!dateVal) {
          logStatus.textContent = 'Please enter a date';
          return;
        }

        try {
          const res = await fetch('https://salado-cafe-premium.onrender.com/api/log-sale', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ Date: dateVal, DailySales: salesVal, DailyGoal: goalVal })
          });
          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.message || 'Failed to log');

          logStatus.textContent = 'Sale logged successfully!';
          logSales.value = '';
          logGoal.value = '';
          const month = parseInt(monthSelect.value, 10);
          const year = new Date().getFullYear();
          fetchSalesData(month, year);
          setTimeout(() => { logStatus.textContent = ''; }, 3000);
        } catch (err) {
          logStatus.textContent = 'Error: ' + err.message;
        }
      });

      const initialMonth = now.getMonth();
      const initialYear = now.getFullYear();
      fetchSalesData(initialMonth, initialYear);
    })();
  </script>
</body>
</html>
