<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salado Cafe Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes greenFlash {
      0% { background-color: rgba(16, 185, 129, 0.45); }
      100% { background-color: transparent; }
    }
    .flash-success {
      animation: greenFlash 0.8s ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-100">
  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl shadow-black/30 p-6 md:p-8">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
        <div>
          <p class="text-xs uppercase tracking-[0.2em] text-emerald-300/80">Cafe Salado Premium</p>
          <h1 class="text-3xl font-semibold text-white">Subscription Control Center</h1>
        </div>
        <button id="refreshBtn" class="px-4 py-2 rounded-xl bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 transition-colors">Refresh</button>
      </div>

      <p id="statusMessage" class="text-sm text-slate-300 mb-4">Loading subscriptions...</p>

      <form id="addSubscriberForm" class="flex flex-wrap items-end gap-3 mb-6 p-4 rounded-2xl border border-white/10 bg-white/5">
        <div class="flex-1 min-w-[140px]">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Name</label>
          <input type="text" name="name" placeholder="Customer Name" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400" required>
        </div>
        <div class="flex-1 min-w-[180px]">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Email</label>
          <input type="email" name="email" placeholder="Email Address" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400" required>
        </div>
        <div class="w-20">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Total</label>
          <input type="number" name="total" placeholder="0" min="1" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400" required>
        </div>
        <div class="w-32">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Start Date</label>
          <input type="date" name="startDate" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-400" required>
        </div>
        <div class="w-28">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Price</label>
          <input type="text" name="price" placeholder="e.g. ₹999" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-emerald-400" required>
        </div>
        <div class="w-20">
          <label class="text-xs text-slate-400 uppercase tracking-wider mb-1 block">Plan</label>
          <select name="mealsPerDay" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-emerald-400" required>
            <option value="1">1/day</option>
            <option value="2">2/day</option>
          </select>
        </div>
        <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 transition-colors whitespace-nowrap">Add New Subscriber</button>
      </form>

      <div class="overflow-x-auto rounded-2xl border border-white/10">
        <table class="min-w-full">
          <thead class="bg-white/10 text-slate-100">
            <tr>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Customer Name</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Email Address</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Total Meals</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Meals Remaining</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Start Date</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Meal Price</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Plan</th>
              <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider">Action</th>
            </tr>
          </thead>
          <tbody id="subscriptionsTableBody" class="divide-y divide-white/10 bg-slate-950/20"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const PASSWORD = 'saladoadmin';
      const input = prompt('Enter admin password:');
      if (input !== PASSWORD) {
        alert('Access denied.');
        document.body.innerHTML = '<div class="min-h-screen flex items-center justify-center text-slate-700 font-semibold">Unauthorized access</div>';
        return;
      }

      const tableBody = document.getElementById('subscriptionsTableBody');
      const statusMessage = document.getElementById('statusMessage');
      const refreshBtn = document.getElementById('refreshBtn');
      const addForm = document.getElementById('addSubscriberForm');
      let subscriptions = [];

      function getTodayFormatted() {
        const today = new Date();
        const day = String(today.getDate()).padStart(2, '0');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${day}-${months[today.getMonth()]}-${today.getFullYear()}`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function setStatus(message, isError = false) {
        statusMessage.textContent = message;
        statusMessage.className = `text-sm mb-4 ${isError ? 'text-rose-300' : 'text-slate-300'}`;
      }

      function renderTable() {
        tableBody.innerHTML = '';

        if (subscriptions.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="8" class="px-4 py-6 text-center text-slate-300">No subscription data found.</td></tr>';
          return;
        }

        const todayFormatted = getTodayFormatted();

        subscriptions.forEach((sub) => {
          const isExhausted = Number(sub.MealsRemaining) <= 0;
          const deliveredToday = sub.LastDeliveredDate === todayFormatted;
          const mealsPerDay = Number(sub.MealsPerDay) || 1;
          const row = document.createElement('tr');
          row.className = 'hover:bg-white/5 transition-colors';
          row.dataset.rowNumber = sub.rowNumber;

          let deliverButtons = '';
          if (deliveredToday) {
            deliverButtons = `
              <button class="mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-slate-500/50 text-slate-300 disabled:cursor-not-allowed" data-row="${sub.rowNumber}" data-meals="1" disabled>Delivered Today</button>`;
          } else if (isExhausted) {
            deliverButtons = `
              <button class="mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-slate-500/50 text-slate-300 disabled:cursor-not-allowed" data-row="${sub.rowNumber}" data-meals="1" disabled>Delivered</button>`;
          } else if (mealsPerDay === 2) {
            deliverButtons = `
              <button class="mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-emerald-400 hover:bg-emerald-300 text-slate-950 disabled:cursor-not-allowed" data-row="${sub.rowNumber}" data-meals="1">Deliver 1</button>
              <button class="mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-emerald-400 hover:bg-emerald-300 text-slate-950 ml-1 disabled:cursor-not-allowed" data-row="${sub.rowNumber}" data-meals="2">Deliver 2</button>`;
          } else {
            deliverButtons = `
              <button class="mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-emerald-400 hover:bg-emerald-300 text-slate-950 disabled:cursor-not-allowed" data-row="${sub.rowNumber}" data-meals="1">Deliver 1</button>`;
          }

          row.innerHTML = `
            <td class="cell-name px-4 py-3 text-sm text-slate-100">${escapeHtml(sub.CustomerName || '')}</td>
            <td class="cell-email px-4 py-3 text-sm text-slate-300">${escapeHtml(sub.EmailAddress || '')}</td>
            <td class="cell-total px-4 py-3 text-sm text-slate-200">${sub.TotalMeals ?? 0}</td>
            <td class="meals-remaining-cell cell-remaining px-4 py-3 text-sm font-semibold ${isExhausted ? 'text-rose-300' : 'text-emerald-300'}">${sub.MealsRemaining ?? 0}</td>
            <td class="cell-startdate px-4 py-3 text-sm text-slate-300">${escapeHtml(sub.StartDate || '-')}</td>
            <td class="cell-price px-4 py-3 text-sm text-slate-300">${escapeHtml(sub.MealPrice || '-')}</td>
            <td class="cell-plan px-4 py-3 text-sm text-slate-300">${mealsPerDay}</td>
            <td class="px-4 py-3">
              ${deliverButtons}
              <button class="edit-btn px-3 py-2 text-sm rounded-xl font-semibold bg-indigo-500 hover:bg-indigo-400 text-white ml-1" data-row="${sub.rowNumber}">Edit</button>
            </td>
          `;
          tableBody.appendChild(row);
        });
      }

      function enterEditMode(rowNumber) {
        const row = tableBody.querySelector(`tr[data-row-number="${rowNumber}"]`);
        if (!row) return;

        const nameCell = row.querySelector('.cell-name');
        const emailCell = row.querySelector('.cell-email');
        const totalCell = row.querySelector('.cell-total');
        const remainingCell = row.querySelector('.cell-remaining');
        const startDateCell = row.querySelector('.cell-startdate');
        const priceCell = row.querySelector('.cell-price');
        const planCell = row.querySelector('.cell-plan');
        const editBtn = row.querySelector('.edit-btn');
        const deliverBtns = row.querySelectorAll('.mark-delivered');

        const currentName = nameCell.textContent;
        const currentEmail = emailCell.textContent;
        const currentTotal = totalCell.textContent;
        const currentRemaining = remainingCell.textContent;
        const currentStartDate = startDateCell.textContent === '-' ? '' : startDateCell.textContent;
        const currentPrice = priceCell.textContent === '-' ? '' : priceCell.textContent;
        const currentPlan = planCell.textContent;

        nameCell.innerHTML = `<input type="text" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${escapeHtml(currentName)}">`;
        emailCell.innerHTML = `<input type="text" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${escapeHtml(currentEmail)}">`;
        totalCell.innerHTML = `<input type="number" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${currentTotal}">`;
        remainingCell.innerHTML = `<input type="number" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${currentRemaining}">`;
        startDateCell.innerHTML = `<input type="text" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${escapeHtml(currentStartDate)}">`;
        priceCell.innerHTML = `<input type="text" class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full" value="${escapeHtml(currentPrice)}">`;
        planCell.innerHTML = `<select class="edit-input bg-slate-800 border border-slate-600 rounded px-2 py-1 text-sm text-slate-100 w-full">
          <option value="1"${currentPlan === '1' ? ' selected' : ''}>1</option>
          <option value="2"${currentPlan === '2' ? ' selected' : ''}>2</option>
        </select>`;

        deliverBtns.forEach(btn => {
          btn.disabled = true;
          btn.className = 'mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-slate-500/50 text-slate-300 disabled:cursor-not-allowed';
          btn.textContent = 'Editing...';
        });

        editBtn.textContent = 'Save';
        editBtn.className = 'edit-btn px-3 py-2 text-sm rounded-xl font-semibold bg-emerald-500 hover:bg-emerald-400 text-white ml-2';
        editBtn.dataset.editing = 'true';
      }

      async function saveEdit(rowNumber, button) {
        const row = tableBody.querySelector(`tr[data-row-number="${rowNumber}"]`);
        if (!row) return;

        const inputs = row.querySelectorAll('.edit-input');
        const values = Array.from(inputs).map(inp => inp.value);

        const payload = {
          rowNumber: Number(rowNumber),
          CustomerName: values[0],
          EmailAddress: values[1],
          TotalMeals: Number(values[2]),
          MealsRemaining: Number(values[3]),
          StartDate: values[4],
          MealPrice: values[5],
          MealsPerDay: Number(values[6])
        };

        try {
          button.disabled = true;
          button.textContent = 'Saving...';

          const response = await fetch('https://salado-cafe-premium.onrender.com/api/update-subscription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to update subscription');
          }

          const sub = subscriptions.find(s => Number(s.rowNumber) === Number(rowNumber));
          if (sub) {
            sub.CustomerName = payload.CustomerName;
            sub.EmailAddress = payload.EmailAddress;
            sub.TotalMeals = payload.TotalMeals;
            sub.MealsRemaining = payload.MealsRemaining;
            sub.StartDate = payload.StartDate;
            sub.MealPrice = payload.MealPrice;
            sub.MealsPerDay = payload.MealsPerDay;
          }

          renderTable();
          setStatus(`Subscription for ${payload.CustomerName} updated successfully.`);
        } catch (error) {
          setStatus(`Save failed: ${error.message}`, true);
          renderTable();
        }
      }

      async function loadSubscriptions() {
        try {
          setStatus('Loading subscriptions...');
          const response = await fetch('https://salado-cafe-premium.onrender.com/api/subscriptions');
          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to fetch subscriptions');
          }

          subscriptions = Array.isArray(result.data) ? result.data : [];
          renderTable();
          setStatus(`Loaded ${subscriptions.length} subscription(s).`);
        } catch (error) {
          setStatus(error.message, true);
        }
      }

      async function markDelivered(rowNumber, mealsToDeduct, button) {
        const rowData = subscriptions.find((item) => Number(item.rowNumber) === Number(rowNumber));
        if (!rowData) return;

        try {
          const response = await fetch('https://salado-cafe-premium.onrender.com/api/mark-delivered', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              rowNumber: rowData.rowNumber,
              CustomerName: rowData.CustomerName,
              EmailAddress: rowData.EmailAddress,
              MealsRemaining: rowData.MealsRemaining,
              TotalMeals: rowData.TotalMeals,
              StartDate: rowData.StartDate,
              MealPrice: rowData.MealPrice,
              mealsToDeduct
            })
          });

          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to mark delivered');
          }

          rowData.MealsRemaining = Number(result.data?.MealsRemaining ?? Math.max(rowData.MealsRemaining - mealsToDeduct, 0));
          rowData.LastDeliveredDate = getTodayFormatted();
          const tableRow = button.closest('tr');
          const deliverBtns = tableRow ? tableRow.querySelectorAll('.mark-delivered') : [];
          deliverBtns.forEach(btn => {
            btn.disabled = true;
            btn.className = 'mark-delivered px-3 py-2 text-sm rounded-xl font-semibold bg-slate-500/50 text-slate-300 disabled:cursor-not-allowed';
            btn.textContent = 'Delivered Today';
          });
          const remainingCell = tableRow?.querySelector('.meals-remaining-cell');
          if (remainingCell) {
            remainingCell.textContent = String(rowData.MealsRemaining);
            remainingCell.classList.remove('text-rose-300');
            remainingCell.classList.add(rowData.MealsRemaining <= 0 ? 'text-rose-300' : 'text-emerald-300');
            remainingCell.classList.add('flash-success');
            setTimeout(() => remainingCell.classList.remove('flash-success'), 800);
          }
          setStatus(`Marked delivered for ${rowData.CustomerName}.`);

          if (rowData.MealsRemaining <= 0) {
            if (confirm('Meals are 0! Do you want to send a Subscription Ended email to ' + rowData.CustomerName + '?')) {
              try {
                await fetch('https://salado-cafe-premium.onrender.com/api/send-ended-email', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    CustomerName: rowData.CustomerName,
                    EmailAddress: rowData.EmailAddress
                  })
                });
                setStatus(`Subscription ended email sent to ${rowData.CustomerName}.`);
              } catch (e) {
                setStatus(`Failed to send ended email: ${e.message}`, true);
              }
            }
          }
          setTimeout(() => loadSubscriptions(), 1000);
        } catch (error) {
          setStatus(`Failed for ${rowData.CustomerName}: ${error.message}`, true);
        }
      }

      async function handleAddSubscription(event) {
        event.preventDefault();
        const formData = new FormData(addForm);
        const payload = {
          CustomerName: formData.get('name'),
          EmailAddress: formData.get('email'),
          TotalMeals: Number(formData.get('total')),
          StartDate: formData.get('startDate'),
          MealPrice: formData.get('price'),
          MealsPerDay: Number(formData.get('mealsPerDay'))
        };

        try {
          setStatus('Adding subscriber...');
          const response = await fetch('https://salado-cafe-premium.onrender.com/api/add-subscription', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || 'Failed to add subscription');
          }

          addForm.reset();
          setStatus(`Subscriber ${payload.CustomerName} added successfully!`);
          await loadSubscriptions();
        } catch (error) {
          setStatus(`Failed to add subscriber: ${error.message}`, true);
        }
      }

      tableBody.addEventListener('click', async (event) => {
        const markBtn = event.target.closest('.mark-delivered');
        if (markBtn) {
          if (markBtn.disabled) return;
          markBtn.disabled = true;
          markBtn.textContent = 'Sending...';
          const meals = Number(markBtn.dataset.meals) || 1;
          await markDelivered(markBtn.dataset.row, meals, markBtn);
          return;
        }

        const editBtn = event.target.closest('.edit-btn');
        if (editBtn) {
          const rowNumber = editBtn.dataset.row;
          if (editBtn.dataset.editing === 'true') {
            await saveEdit(rowNumber, editBtn);
          } else {
            enterEditMode(rowNumber);
          }
        }
      });

      addForm.addEventListener('submit', handleAddSubscription);
      refreshBtn.addEventListener('click', loadSubscriptions);
      loadSubscriptions();
    })();
  </script>
</body>
</html>
